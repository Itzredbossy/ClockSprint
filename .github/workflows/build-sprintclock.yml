
name: Build SprintClock APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        run: |
          for dir in "." "New Folder45" "project" "New Folder45/project"; do
            if [ -f "$dir/settings.gradle" ] && [ -f "$dir/app/build.gradle" ]; then
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              echo "Found Android project: $dir"
              exit 0
            fi
          done

          echo "Android project not found"
          find . -maxdepth 4 -name settings.gradle
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SprintClock-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
