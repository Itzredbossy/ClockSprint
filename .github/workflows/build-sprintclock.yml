
name: Build SprintClock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug repository structure
        run: |
          echo "ROOT:"
          pwd
          ls -la

          echo "GRADLE FILES:"
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

          echo "ANDROID FILES:"
          find . -name AndroidManifest.xml -print
          find . -name sprint_scanner.xml -print
          
