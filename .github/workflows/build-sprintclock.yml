
name: Build SprintClock APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SprintClock-source.zip'
      - '.github/workflows/build-sprintclock.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q SprintClock-source.zip -d project

      - name: Fix ZXing scanner laser color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          layout = Path("project/app/src/main/res/layout/sprint_scanner.xml")

          if not layout.is_file():
              raise SystemExit(f"Missing file: {layout}")

          xml = layout.read_text()

          fixed, count = re.subn(
              r'(zxing_viewfinder_laser\s*=\s*")false(")',
              r'\1@android:color/transparent\2',
              xml
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one invalid laser color, found {count}"
              )

          layout.write_text(fixed)
          print("ZXing laser color fixed.")

          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SprintClock-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
