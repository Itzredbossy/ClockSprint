name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source-1-1.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source-1-1.zip
        run: |
          ls -la
          test -f source-1-1.zip || { echo "source-1-1.zip missing at repo root"; exit 1; }

      - name: Extract source-1-1.zip
        run: |
          rm -rf app
          mkdir -p app
          unzip -q source-1-1.zip -d app
          if [ "$(find app -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] \
             && [ "$(find app -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            top=$(find app -mindepth 1 -maxdepth 1 -type d | head -1)
            shopt -s dotglob nullglob
            mv "$top"/* app/
            rmdir "$top" 2>/dev/null || true
          fi
          ls -la app
          test -f app/pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f07c9298f6a79b83" > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf '%s\n' "d56f5187479451be63d0bf35cd44fdbb0a7a7e79" > "$SDK_ROOT/licenses/android-googletv-license"
          printf '%s\n' "601085b94cd77f0b54ff86406957099ebe79c4d6" > "$SDK_ROOT/licenses/android-google-gdk-license"
          printf '%s\n' "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_ROOT/licenses/google-gdk-license"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/tmp/sdk-licenses.log 2>&1 || true
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Installed Android SDK at $SDK_ROOT"
          ls -la "$SDK_ROOT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Configure Flutter Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          flutter config --android-sdk "$ANDROID_HOME"
          flutter doctor -v

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
