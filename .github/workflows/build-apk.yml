name: Extract Zip and Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source.zip
        run: |
          mkdir -p extracted
          unzip -q source.zip -d extracted

          # If the zip contains a single wrapper folder, move its contents up one level
          top_entries=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$top_entries" -eq 1 ]; then
            only_entry=$(find extracted -mindepth 1 -maxdepth 1)
            if [ -d "$only_entry" ]; then
              mv "$only_entry"/* "$only_entry"/.[!.]* extracted/ 2>/dev/null || true
              rmdir "$only_entry"
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: extracted
        run: flutter pub get

      - name: Run static analysis and tests
        working-directory: extracted
        run: |
          flutter analyze
          flutter test

      - name: Build release APK
        working-directory: extracted
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-release-apk
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          
