name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source-1.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source-1.zip exists
        run: |
          echo "Repo root:"
          ls -la
          if [ ! -f source-1.zip ]; then
            echo "::error::source-1.zip not found in repository root"
            exit 1
          fi
          ls -lh source-1.zip

      - name: Extract source-1.zip
        run: |
          rm -rf app
          mkdir -p app
          unzip -q source-1.zip -d app

          count=$(find app -mindepth 1 -maxdepth 1 | wc -l)
          dirs=$(find app -mindepth 1 -maxdepth 1 -type d | wc -l)
          files=$(find app -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$dirs" -eq 1 ] && [ "$files" -eq 0 ]; then
            top=$(find app -mindepth 1 -maxdepth 1 -type d | head -1)
            echo "Flattening folder: $top"
            shopt -s dotglob nullglob
            mv "$top"/* app/
            rmdir "$top" || true
          fi

          echo "Extracted tree:"
          ls -la app
          if [ ! -f app/pubspec.yaml ]; then
            echo "::error::pubspec.yaml not found after extract"
            find app -name pubspec.yaml
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: List APK
        run: |
          find app/build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
