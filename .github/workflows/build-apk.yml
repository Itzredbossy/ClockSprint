name: Extract Zip and Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source.zip
        run: |
          mkdir -p extracted
          unzip -q source.zip -d extracted

          top_entries=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$top_entries" -eq 1 ]; then
            only_entry=$(find extracted -mindepth 1 -maxdepth 1)
            if [ -d "$only_entry" ]; then
              mv "$only_entry"/* "$only_entry"/.[!.]* extracted/ 2>/dev/null || true
              rmdir "$only_entry"
            fi
          fi

      - name: Update AGP, Kotlin, and Gradle wrapper
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          root = Path("extracted/android")

          settings = root / "settings.gradle"
          if settings.exists():
              text = settings.read_text(encoding="utf-8")
              text = re.sub(
                  r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>8.6.0\2',
                  text,
              )
              text = re.sub(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>2.0.20\2',
                  text,
              )
              settings.write_text(text, encoding="utf-8")

          build_gradle = root / "build.gradle"
          if build_gradle.exists():
              text = build_gradle.read_text(encoding="utf-8")
              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[^"\'\s]+',
                  r'\g<1>8.6.0',
                  text,
              )
              build_gradle.write_text(text, encoding="utf-8")

          wrapper = root / "gradle/wrapper/gradle-wrapper.properties"
          if wrapper.exists():
              text = wrapper.read_text(encoding="utf-8")
              text = re.sub(
                  r'(distributionUrl\s*=\s*).*',
                  r'\1https\\://services.gradle.org/distributions/gradle-8.8-all.zip',
                  text,
              )
              wrapper.write_text(text, encoding="utf-8")
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: extracted
        run: flutter pub get

      - name: Run static analysis and tests
        working-directory: extracted
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build release APK
        working-directory: extracted
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint-timer-release-apk
          path: extracted/build/app/outputs/flutter-apk/app-release.apk
          
